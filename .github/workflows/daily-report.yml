name: Daily Relist Summary Report

on:
  schedule:
    # Rozana raat 11:55 PM PKT = 6:55 PM UTC (18:55 UTC)
    - cron: '55 18 * * *'
  workflow_dispatch:

jobs:
  send-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: npm install nodemailer

      - name: Fetch Today's Successful Runs & Send Email
        uses: actions/github-script@v7
        env:
          MAIL_USER: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASS: ${{ secrets.MAIL_PASSWORD }}
        with:
          script: |
            const nodemailer = require('nodemailer');

            // 24 ghante ke pichle runs fetch karna
            const now = new Date();
            const oneDayAgo = new Date(now.getTime() - (24 * 60 * 60 * 1000));

            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'relist.yml',
              created: `>=${oneDayAgo.toISOString()}`,
              per_page: 100
            });

            const totalRuns = runs.data.workflow_runs;
            const successRuns = totalRuns.filter(r => r.conclusion === 'success');
            const failedRuns = totalRuns.filter(r => r.conclusion === 'failure');

            const messageBody = `
            Assalam-o-Alaikum!

            JFS Auto Relist ki 24 Ghante ki Daily Report:
            --------------------------------------------------
            ✅ Successful Runs: ${successRuns.length} / 10
            ❌ Failed Runs:     ${failedRuns.length}
            🔄 Total Runs:      ${totalRuns.length}

            Target: 10 runs daily (Custom PKT Schedule)
            Status: ${successRuns.length >= 10 ? 'Mubarak ho! Aaj ke tamam 10 scheduled relist runs kamyabi se complete hue.' : 'System ne pichle 24 ghante mein ' + successRuns.length + ' / 10 runs successfully relist kiye.'}
            --------------------------------------------------
            `;

            console.log(messageBody);

            const transporter = nodemailer.createTransport({
              service: 'gmail',
              auth: {
                user: process.env.MAIL_USER,
                pass: process.env.MAIL_PASS
              }
            });

            await transporter.sendMail({
              from: `"JFS Relist Bot" <${process.env.MAIL_USER}>`,
              to: process.env.MAIL_USER,
              subject: `Daily JFS Relist Report: ${successRuns.length}/10 Runs Completed ✅`,
              text: messageBody
            });
